name: Pinned Nix environment
description: Restore one exact toolchain profile; save explicitly before signing secrets exist.
inputs:
  profile:
    description: ci or signing
    required: true
  write-cache:
    description: Allow this trusted invocation to seed its ref-scoped cache
    default: 'false'
  use-cache:
    description: Enable Nix store restore/save (disable for a cold benchmark)
    default: 'true'
outputs:
  cache-hit:
    description: Exact toolchain/Nix/profile cache hit
    value: ${{ steps.cache.outputs.hit-primary-key }}
runs:
  using: composite
  steps:
    - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
    - name: Identify pinned environment
      id: identity
      shell: bash
      env:
        PROFILE: ${{ inputs.profile }}
        TOOLCHAIN_HASH: ${{ hashFiles('flake.lock', 'flake.nix', 'devshell.nix') }}
      run: |
        [[ "$PROFILE" == ci || "$PROFILE" == signing ]] || exit 2
        version="$(nix --version | sha256sum | cut -d' ' -f1)"
        printf 'key=nix-v4-%s-%s-%s-%s-%s\n' "$RUNNER_OS" "$RUNNER_ARCH" "$version" "$PROFILE" "$TOOLCHAIN_HASH" >> "$GITHUB_OUTPUT"
        printf 'legacy-key=nix-v2-%s-%s-%s-%s-%s\n' "$RUNNER_OS" "$RUNNER_ARCH" "$version" "$PROFILE" "$TOOLCHAIN_HASH" >> "$GITHUB_OUTPUT"
    - name: Restore Nix toolchain and profile
      id: cache
      if: inputs.use-cache == 'true'
      uses: nix-community/cache-nix-action/restore@7df957e333c1e5da7721f60227dbba6d06080569 # v7
      with:
        primary-key: ${{ steps.identity.outputs.key }}
        paths: |
          .cache/nix-${{ inputs.profile }}
          .cache/nix-${{ inputs.profile }}-*-link
    - name: Restore exact previous store-only format
      if: inputs.use-cache == 'true' && steps.cache.outputs.hit-primary-key != 'true'
      uses: nix-community/cache-nix-action/restore@7df957e333c1e5da7721f60227dbba6d06080569 # v7
      with:
        primary-key: ${{ steps.identity.outputs.legacy-key }}
    - name: Restore workspace cache ownership
      shell: bash
      run: |
        [[ ! -L .cache ]] || exit 2
        mkdir -p .cache
        # The Nix cache restores as root. Never dereference its links into /nix/store.
        sudo chown -hR "$(id -u):$(id -g)" .cache
    - name: Realize and retain environment
      shell: bash
      env:
        PROFILE: ${{ inputs.profile }}
        CACHE_HIT: ${{ steps.cache.outputs.hit-primary-key }}
      run: |
        started=$SECONDS
        profile=".cache/nix-$PROFILE"
        cached=false
        if [[ "$CACHE_HIT" == true && -L "$profile" ]]; then
          target="$(readlink -f "$profile")"
          if [[ "$target" == /nix/store/*-ichuchu-"$PROFILE"-env ]] && nix develop "$profile" --command true; then
            cached=true
          fi
        fi
        if [[ "$cached" != true ]]; then
          nix develop ".#$PROFILE" --profile "$profile" --no-update-lock-file --command true
        fi
        printf '%s\t%s\t%s\n' "$PROFILE" "$((SECONDS - started))" "$cached" > ".cache/nix-$PROFILE-timings.tsv"
        nix path-info --json --closure-size "$(readlink -f "$profile")" > ".cache/nix-$PROFILE-closure.json"
    - name: Save Nix toolchain before credentials
      if: inputs.use-cache == 'true' && inputs.write-cache == 'true' && steps.cache.outputs.hit-primary-key != 'true'
      uses: nix-community/cache-nix-action/save@7df957e333c1e5da7721f60227dbba6d06080569 # v7
      with:
        primary-key: ${{ steps.identity.outputs.key }}
        paths: |
          .cache/nix-${{ inputs.profile }}
          .cache/nix-${{ inputs.profile }}-*-link
        gc-max-store-size-linux: 0
        purge: false
